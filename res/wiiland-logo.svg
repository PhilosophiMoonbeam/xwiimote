<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">WiiLand</title>
  <desc id="desc">A pearl-white Wii Remote floats inside a glass world of blue sky and green hills, circled by a silver orbit. A flowing lowercase wiiland wordmark sits alongside it. Native Wii input for Linux.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#f1f4ee"/>
      <stop offset=".48" stop-color="#f9faf5"/>
      <stop offset="1" stop-color="#e7eeea"/>
    </linearGradient>
    <radialGradient id="air">
      <stop stop-color="#a4d5c6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#a4d5c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist">
      <stop stop-color="#b9d9e5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b9d9e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#23778e"/>
      <stop offset=".35" stop-color="#6bc1cf"/>
      <stop offset=".7" stop-color="#cceddb"/>
      <stop offset="1" stop-color="#e3edaf"/>
    </linearGradient>
    <radialGradient id="sun" cx=".69" cy=".35" r=".55">
      <stop stop-color="#fffef0" stop-opacity=".92"/>
      <stop offset=".24" stop-color="#f6ffec" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f0fff4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill-far" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#deed8d"/>
      <stop offset=".35" stop-color="#9fc76c"/>
      <stop offset="1" stop-color="#4b9e7b"/>
    </linearGradient>
    <linearGradient id="hill-near" x1=".15" y1="0" x2=".8" y2="1">
      <stop stop-color="#8dc993"/>
      <stop offset=".5" stop-color="#319183"/>
      <stop offset="1" stop-color="#146c79"/>
    </linearGradient>
    <radialGradient id="glass" cx=".48" cy=".38" r=".64">
      <stop offset=".6" stop-color="#086777" stop-opacity="0"/>
      <stop offset=".87" stop-color="#165f6a" stop-opacity=".15"/>
      <stop offset=".97" stop-color="#034a60" stop-opacity=".7"/>
      <stop offset="1" stop-color="#d6f8ef" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".35" stop-color="#dceae3"/>
      <stop offset=".6" stop-color="#739c9b"/>
      <stop offset=".8" stop-color="#eff9ed"/>
      <stop offset="1" stop-color="#9ab8b2"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#adc5c4"/>
      <stop offset=".13" stop-color="#f9fff9"/>
      <stop offset=".64" stop-color="#fffef5"/>
      <stop offset=".88" stop-color="#e0eae1"/>
      <stop offset="1" stop-color="#8dafb1"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#fcfff9"/>
      <stop offset="1" stop-color="#c6d8d3"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="440" y1="174" x2="1004" y2="248">
      <stop stop-color="#285960"/>
      <stop offset=".52" stop-color="#3d6b68"/>
      <stop offset="1" stop-color="#56816d"/>
    </linearGradient>
    <radialGradient id="dot" cx=".32" cy=".22" r=".8">
      <stop stop-color="#f6fff4"/>
      <stop offset=".3" stop-color="#b0dac6"/>
      <stop offset=".7" stop-color="#5b9e94"/>
      <stop offset="1" stop-color="#386f75"/>
    </radialGradient>
    <filter id="ground" x="-.5" y="-2" width="2" height="5">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="remote-shadow" x="-.7" y="-.3" width="2.5" height="1.7">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="world"><circle cx="230" cy="210" r="126"/></clipPath>
    <clipPath id="canvas"><rect width="1200" height="440" rx="6"/></clipPath>
  </defs>

