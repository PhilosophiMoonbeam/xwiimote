<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">WiiLand</title>
  <desc id="desc">A Wii Remote rising over a bright Linux input landscape</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1822"/>
      <stop offset="0.55" stop-color="#102733"/>
      <stop offset="1" stop-color="#123c3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.58" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="worldClip">
      <circle cx="182" cy="180" r="124"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="1184" height="344" rx="52" fill="url(#panel)"/>
  <rect x="9" y="9" width="1182" height="342" rx="51" fill="none" stroke="#d8fffb" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="344" rx="52" fill="url(#glow)"/>

  <g opacity="0.16" fill="none" stroke="#99f6e4" stroke-width="1.5">
    <path d="M845 58c66 22 98 62 158 58 54-3 86-34 142-22"/>
    <path d="M824 77c78 25 113 68 180 64 59-3 91-34 151-20"/>
    <path d="M872 305c58-30 100-34 156-13 46 18 84 13 130-12"/>
  </g>
  <g fill="#ccfbf1">
    <circle cx="1095" cy="70" r="3" opacity="0.66"/>
    <circle cx="1130" cy="111" r="2" opacity="0.42"/>
    <circle cx="1047" cy="95" r="2" opacity="0.5"/>
  </g>

  <circle cx="182" cy="180" r="130" fill="#020617" opacity="0.32" filter="url(#soft)"/>
  <g clip-path="url(#worldClip)">
    <rect x="58" y="56" width="248" height="248" fill="url(#sky)"/>
    <circle cx="230" cy="116" r="30" fill="#fde68a" opacity="0.32" filter="url(#soft)"/>
    <circle cx="230" cy="116" r="23" fill="#fbbf24"/>
    <path d="M45 257c48-53 86-69 132-40 42 27 78 16 141-30v127H45z" fill="#0f766e" opacity="0.8"/>
    <path d="M45 276c54-37 97-45 142-17 39 24 78 20 131-5v60H45z" fill="url(#land)"/>
    <path d="M48 292c66-23 118-18 164 3 34 15 66 16 106 7v24H48z" fill="#064e3b"/>
    <path d="M47 203c37-17 74-18 110-2" fill="none" stroke="#ecfeff" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="182" cy="180" r="124" fill="none" stroke="#ccfbf1" stroke-opacity="0.3" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="112" y="56" width="78" height="240" rx="31" fill="#eaf7f5" stroke="#062c35" stroke-width="4"/>
    <rect x="119" y="64" width="64" height="224" rx="25" fill="#f8fffe"/>
    <circle cx="151" cy="83" r="6" fill="none" stroke="#0ea5e9" stroke-width="3"/>
    <path d="M143 105h16v10h10v16h-10v10h-16v-10h-10v-16h10z" fill="#183744"/>
    <circle cx="151" cy="168" r="12" fill="#14b8a6"/>
    <circle cx="151" cy="168" r="5" fill="#ccfbf1" opacity="0.72"/>
    <rect x="132" y="198" width="14" height="5" rx="2.5" fill="#4b6770"/>
    <circle cx="153" cy="200.5" r="6" fill="none" stroke="#4b6770" stroke-width="3"/>
    <path d="M163 198h14v5h-14zM167.5 193.5h5v14h-5z" fill="#4b6770"/>
    <circle cx="140" cy="237" r="7" fill="#244753"/>
    <circle cx="162" cy="254" r="7" fill="#244753"/>
    <g fill="#14b8a6">
      <rect x="134" y="274" width="8" height="3" rx="1.5"/>
      <rect x="146" y="274" width="8" height="3" rx="1.5" opacity="0.66"/>
      <rect x="158" y="274" width="8" height="3" rx="1.5" opacity="0.36"/>
    </g>
  </g>

  <g fill="none" stroke="#ecfeff" stroke-linecap="round">
    <path d="M209 91c18 6 31 18 38 35" stroke-width="5" opacity="0.96"/>
    <path d="M216 69c29 9 50 29 61 56" stroke-width="5" opacity="0.68"/>
    <path d="M224 46c39 12 67 39 81 76" stroke-width="5" opacity="0.36"/>
  </g>

  <g>
    <text x="350" y="174" fill="#f8fffe" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="102" font-weight="750" letter-spacing="-4">WiiLand</text>
    <rect x="354" y="197" width="558" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="354" y="250" fill="#ccfbf1" font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="29" font-weight="500" letter-spacing="0.4">Native Wii input for Linux</text>
    <g font-family="Inter, Segoe UI, DejaVu Sans, sans-serif" font-size="17" font-weight="650" letter-spacing="1.1">
      <text x="355" y="296" fill="#99f6e4">WAYLAND</text>
      <circle cx="464" cy="290" r="3" fill="#38bdf8"/>
      <text x="482" y="296" fill="#bae6fd">X.ORG</text>
      <circle cx="560" cy="290" r="3" fill="#38bdf8"/>
      <text x="578" y="296" fill="#fde68a">UINPUT</text>
    </g>
  </g>

  <g transform="translate(1003 178)" fill="none" stroke-linecap="round">
    <path d="M-13 34 0 21l13 13 30-30" stroke="#5eead4" stroke-width="7" stroke-linejoin="round"/>
    <path d="M40 4h3v3" stroke="#fbbf24" stroke-width="7"/>
    <circle cx="12" cy="20" r="61" stroke="#ccfbf1" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="12" cy="20" r="45" stroke="#ccfbf1" stroke-opacity="0.1" stroke-width="2"/>
  </g>
</svg>
