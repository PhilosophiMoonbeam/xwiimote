# X.org-only suppression for raw Wii Remote pointer input.
# WiiLand reports accelerometer and IR data as absolute axes. Ignore the raw
# kernel event nodes so X.org does not create duplicate pointer input alongside
# WiiLand's virtual devices. These InputClass matches intentionally retain their
# existing semantics and ordering: the Classic and Pro overrides remain below.
# WiiLand's virtual uinput devices and libxwiimote access are unaffected.
#
# To use IR data as mouse input, use the WiiLand tools or
# xf86-input-wiimote-derived integrations which overwrite this.

Section "InputClass"
	Identifier "Nintendo Wii Remote Raw Input Blacklist"
	MatchProduct "Nintendo Wii Remote"
	MatchDevicePath "/dev/input/event*"
	Option "Ignore" "on"
EndSection

Section "InputClass"
	Identifier "Nintendo Wii Remote Classic Controller Whitelist"
	MatchProduct "Nintendo Wii Remote Classic Controller"
	MatchDevicePath "/dev/input/event*"
	Option "Ignore" "off"
EndSection

Section "InputClass"
	Identifier "Nintendo Wii Remote Pro Controller Whitelist"
	MatchProduct "Nintendo Wii Remote Pro Controller"
	MatchDevicePath "/dev/input/event*"
	Option "Ignore" "off"
EndSection
