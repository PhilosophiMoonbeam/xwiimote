    <g transform="rotate(-17 221 212)">
      <rect x="198" y="126" width="58" height="193" rx="18" fill="#215d65" opacity=".35" filter="url(#remote-shadow)"/>
      <rect x="185" y="107" width="61" height="202" rx="17" fill="url(#shell)" stroke="#769da0" stroke-width=".8"/>
      <rect x="189" y="110" width="52" height="194" rx="14" fill="none" stroke="#fff" stroke-opacity=".8"/>
      <path d="M197 115h26" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="201" cy="122" r="4" fill="url(#button)" stroke="#a9c2b8" stroke-width=".7"/>
      <path d="M201 119v3m-2.1-1.8a2.8 2.8 0 1 0 4.2 0" fill="none" stroke="#709c84" stroke-width=".9" stroke-linecap="round"/>
      <path d="M210 139h11v10h10v11h-10v10h-11v-10h-10v-11h10Z" fill="#b4c9c5" stroke="#9eb7b1" stroke-width="2" stroke-linejoin="round"/>
      <path d="M210 137h11v10h10v11h-10v10h-11v-10h-10v-11h10Z" fill="url(#button)" stroke="#9ab6b2" stroke-width=".7" stroke-linejoin="round"/>
      <circle cx="215.5" cy="152.5" r="2.7" fill="#edf5eb" stroke="#bdcec5" stroke-width=".7"/>
      <circle cx="215.5" cy="188" r="10" fill="#9bb8b2"/>
      <circle cx="215.5" cy="186.5" r="9.5" fill="url(#button)" stroke="#abc3ba" stroke-width=".7"/>
      <path d="m212.5 190 3-7 3 7m-5-2h4" fill="none" stroke="#839f98" stroke-width=".9" stroke-linejoin="round"/>
      <g fill="url(#button)" stroke="#b2c9c0" stroke-width=".65">
        <circle cx="200" cy="212" r="4.1"/><circle cx="215.5" cy="212" r="4.5"/><circle cx="231" cy="212" r="4.1"/>
      </g>
      <g fill="none" stroke="#829f97" stroke-width=".8" stroke-linecap="round">
        <path d="M198.4 212h3.2m28 0h3.2m-1.6-1.6v3.2"/>
        <path d="m213.3 211.7 2.2-1.8 2.2 1.8m-3.8-.4v3h3.2v-3" stroke="#6dabb8"/>
      </g>
      <g fill="#99b2aa">
        <circle cx="211" cy="226" r=".85"/><circle cx="215.5" cy="226" r=".85"/><circle cx="220" cy="226" r=".85"/>
        <circle cx="211" cy="230" r=".85"/><circle cx="215.5" cy="230" r=".85"/><circle cx="220" cy="230" r=".85"/>
        <circle cx="211" cy="234" r=".85"/><circle cx="215.5" cy="234" r=".85"/><circle cx="220" cy="234" r=".85"/>
      </g>
      <circle cx="215.5" cy="252" r="6.5" fill="url(#button)" stroke="#aec5bc" stroke-width=".7"/>
      <circle cx="215.5" cy="271" r="6.5" fill="url(#button)" stroke="#aec5bc" stroke-width=".7"/>
      <g fill="none" stroke="#849f95" stroke-width=".85" stroke-linecap="round" stroke-linejoin="round">
        <path d="m214 250.3 1.5-1v5m-1.5 0h3"/>
        <path d="M213.5 269.7c.2-2.5 4-2.2 3.6.1-.2 1-3.6 3.3-3.6 3.3h3.8"/>
      </g>
      <rect x="200" y="289" width="5" height="2.6" rx=".8" fill="#39b7d1"/>
      <g fill="#c1d2c6"><rect x="209" y="289" width="5" height="2.6" rx=".8"/><rect x="218" y="289" width="5" height="2.6" rx=".8"/><rect x="227" y="289" width="5" height="2.6" rx=".8"/></g>
    </g>
    <path d="M125 157c24-53 82-81 140-60 29 10 46 25 60 48-57-30-116 35-175 25-13-2-21-7-25-13Z" fill="url(#reflection)" opacity=".73"/>
    <path d="M161 112c33-22 78-26 112-12" fill="none" stroke="#fff" stroke-opacity=".88" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M121 200c-4-38 15-69 34-87" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <path d="M285 312c29-15 50-42 58-68" fill="none" stroke="#c5ffec" stroke-opacity=".65" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <circle cx="230" cy="210" r="126" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".9"/>
  <path d="M76.3 281.2c9.9 23.4 86.8 14.8 171.7-21.2 84.9-36.1 145.6-84.3 135.7-107.7" fill="none" stroke="#799f9d" stroke-opacity=".35" stroke-width="4.3"/>
  <path d="M76.3 280.2c9.9 23.4 86.8 14.8 171.7-21.2 84.9-36.1 145.6-84.3 135.7-107.7" fill="none" stroke="url(#silver)" stroke-width="2.5"/>
  <circle cx="359" cy="205" r="4.2" fill="#fcfff5"/>
  <circle cx="359" cy="205" r="2.2" fill="#cee7d1"/>

</svg>
