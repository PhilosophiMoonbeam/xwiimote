# WiiLand display-neutral bridge configuration.
# Copy to /etc/wiiland/wiilandd.conf for system defaults or to
# ~/.config/wiiland/wiilandd.conf for user overrides.

# Input backend. uinput is the common display-server-independent baseline.
backend=uinput

# Default profile for controllers without a more specific device rule.
# gamepad is safest for session startup; desktop also emits pointer/keyboard input.
profile=gamepad

# Desktop pointer speed for D-pad repeat motion. Valid range: 1-127.
pointer-speed=16

# IR camera pointer gain. Default 8 preserves one eighth of raw IR delta.
ir-speed=8

# IR camera jitter deadzone after gain scaling. Default 0 preserves all motion.
ir-deadzone=0

# IR camera smoothing percentage. Default 0 preserves direct pointer motion.
ir-smoothing=0

# IR tracking. `dual` tracks the midpoint of the widest valid IR-dot pair so
# source ordering swaps do not jerk the cursor; `centroid` averages every valid
# dot; `first` preserves the legacy first-source tracker. Screen calibration is
# optional and only used when `ir-aim-mapping=absolute`.
ir-tracking=dual
# ir-aim-mapping=relative
# ir-screen-left=0
# ir-screen-right=1023
# ir-screen-top=0
# ir-screen-bottom=767

# Modern motion aiming. Disabled by default for conservative session behavior.
# Enable `aim-mode=right-stick` for Steam/non-Steam games that expect camera aim
# on ABS_RX/ABS_RY, or `aim-mode=mouse` for universal pointer-style aiming.
# `aim-source=auto` prefers IR when visible, then MotionPlus, then accelerometer
# tilt. Run `wiilandd --device 1 --calibrate-aim` with the Wii Remote face down
# and still on a flat surface, then paste the generated `aim-accel-zero-*` and
# `aim-motion-plus-bias-*` lines here for persistent Wii-style calibration.
# aim-mode=off
# aim-source=auto
# aim-activation=b
# aim-sensitivity=16
# aim-deadzone=4
# aim-smoothing=25
# aim-invert-x=no
# aim-invert-y=no
# aim-calibration-duration=8
# aim-accel-zero-x=0
# aim-accel-zero-y=0
# aim-accel-zero-z=0
# aim-motion-plus-bias-x=0
# aim-motion-plus-bias-y=0
# aim-motion-plus-bias-z=0

# Optional desktop button remaps. Supported buttons: a, b, plus, minus, home,
# one, two. Supported actions: left-click, right-click, enter, escape, overview,
# page-up, page-down, disabled.
# desktop.a=left-click
# desktop.b=right-click

# Optional per-device overrides. `device.*` matches a substring of the sysfs path
# reported by `wiilandd --list`; `device-type.*` matches the hid-wiimote devtype
# attribute such as gen10, gen20, balanceboard, or procontroller. Later matches
# win.
# device.bluetooth.profile=desktop
# device-type.balanceboard.profile=gamepad
# device-type.procontroller.profile=both
