# WiiLand Wayland bridge configuration.
# Copy to /etc/wiiland/wiilandd.conf for system defaults or to
# ~/.config/wiiland/wiilandd.conf for user overrides.

# Default profile for controllers without a more specific device rule.
# gamepad is safest for login sessions; desktop also emits pointer/keyboard input.
profile=gamepad

# Desktop pointer speed for D-pad repeat motion. Valid range: 1-127.
pointer-speed=16

# IR camera pointer gain. Default 8 preserves one eighth of raw IR delta.
ir-speed=8

# Optional desktop button remaps. Supported buttons: a, b, plus, minus, home,
# one, two. Supported actions: left-click, right-click, enter, escape, overview,
# page-up, page-down, disabled.
# desktop.a=left-click
# desktop.b=right-click

# Optional per-device overrides. `device.*` matches a substring of the sysfs path
# reported by `wiilandd --list`; `device-type.*` matches the hid-wiimote devtype
# attribute such as gen10, gen20, balanceboard, or procontroller. Later matches
# win.
# device.bluetooth.profile=desktop
# device-type.balanceboard.profile=gamepad
# device-type.procontroller.profile=both
