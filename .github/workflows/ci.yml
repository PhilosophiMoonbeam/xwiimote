name: ci

on:
  push:
  pull_request:

jobs:
  wiilandd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential groff
      - name: Run wiilandd smoke script
        run: tests/wiilandd-smoke.sh
