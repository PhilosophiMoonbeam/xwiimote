name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and native integration dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            groff \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config \
            udev \
            weston \
            xauth \
            xvfb \
            xz-utils
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.98.0
          test "$(rustc --version | cut -d' ' -f2)" = 1.98.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the locked workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run locked workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Smoke test CLI and daemon commands
        run: |
          set -eu
          daemon="$PWD/target/debug/wiilandd"
          report="$PWD/target/debug/wiilandd-hardware-report"
          tui="$PWD/target/debug/xwiishow"
          dump="$PWD/target/debug/xwiidump"
          "$daemon" --help >/dev/null
          "$daemon" --no-config --self-test
          "$daemon" --no-config --check-config >/dev/null
          "$daemon" --no-config --axis-map >/dev/null
          "$daemon" --no-config --validation-checklist >/dev/null
          "$daemon" --no-config --doctor >/dev/null
          "$tui" --help >/dev/null
          "$dump" --help >/dev/null
          WIILANDD="$daemon" WIILAND_REPO_DIR="$PWD" \
            "$report" --help >/dev/null
          WIILANDD="$daemon" WIILAND_REPO_DIR="$PWD" \
            "$report" >"$RUNNER_TEMP/wiiland-hardware-report"
          grep -F 'report.schema.version=2' \
            "$RUNNER_TEMP/wiiland-hardware-report" >/dev/null
          grep -F 'report.status=ok' \
            "$RUNNER_TEMP/wiiland-hardware-report" >/dev/null

      - name: Build the release workspace
        run: cargo xtask build --release --features gui,tui,integrations


      - name: Smoke GUI under X11
        run: |
          set -eu
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            env \
              WINIT_UNIX_BACKEND=x11 \
              WIILAND_CONFIG_SMOKE_TEST=1 \
              "$PWD/target/release/wiiland-config"

      - name: Smoke GUI with the headless Wayland backend
        run: |
          set -eu
          runtime="$RUNNER_TEMP/wiiland-wayland-runtime"
          socket=wiiland-wayland-0
          log="$RUNNER_TEMP/wiiland-weston.log"
          weston_pid=
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [ -n "$weston_pid" ] && kill -0 "$weston_pid" 2>/dev/null; then
              kill "$weston_pid" 2>/dev/null || :
              wait "$weston_pid" 2>/dev/null || :
            fi
            rm -rf "$runtime"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          umask 077
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"
          export WAYLAND_DISPLAY="$socket"
          weston \
            --backend=headless \
            --renderer=pixman \
            --shell=kiosk \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            >"$log" 2>&1 &
          weston_pid=$!
          for _ in $(seq 1 100); do
            [ -S "$runtime/$socket" ] && break
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.1
          done
          test -S "$runtime/$socket"
          env \
            DISPLAY= \
            WINIT_UNIX_BACKEND=wayland \
            XDG_SESSION_TYPE=wayland \
            WIILAND_CONFIG_SMOKE_TEST=1 \
            "$PWD/target/release/wiiland-config"

      - name: Exercise real uinput when available
        run: |
          set -eu
          sudo modprobe uinput 2>/dev/null || :
          if test -r /dev/uinput && test -w /dev/uinput; then
            WIILAND_REAL_UINPUT=1 cargo test --locked -p wiilandd \
              --test uinput_real -- \
              --ignored --exact \
              real_uinput_creates_emits_and_destroys_both_device_kinds
            echo "uinput: pass (real create/emit/sync/destroy test completed)"
          elif test -e /dev/uinput; then
            echo "uinput: skip (device exists but is not readable and writable)"
          else
            echo "uinput: skip (kernel module or device unavailable)"
          fi

      - name: Stage installation and validate assets
        run: |
          set -eu
          stage="$RUNNER_TEMP/wiiland-stage"
          cargo xtask install --release --destdir "$stage" \
            --prefix /usr \
            --sysconfdir /etc \
            --with-udev-rules-dir /usr/lib/udev/rules.d \
            --with-systemd-user-unit-dir /usr/lib/systemd/user \
            --with-xorg-conf-dir /usr/share/X11/xorg.conf.d \
            --features gui,tui,integrations
          test -x "$stage/usr/bin/wiilandd"
          test -x "$stage/usr/bin/wiilandd-hardware-report"
          test -x "$stage/usr/bin/wiiland-config"
          test -x "$stage/usr/bin/xwiishow"
          test ! -e "$stage/usr/include/xwiimote.h"
          test ! -e "$stage/usr/lib/libxwiimote.so.2"
          test ! -e "$stage/usr/lib/pkgconfig/libxwiimote.pc"
          for rule in "$stage/usr/lib/udev/rules.d/"*.rules; do
            test -s "$rule"
            udevadm verify "$rule"
          done
          desktop="$stage/usr/share/applications/io.github.philosophimoonbeam.wiiland-config.desktop"
          desktop-file-validate "$desktop"
          for manual in "$stage/usr/share/man/man1/"*.1 \
              "$stage/usr/share/man/man7/"*.7; do
            test -s "$manual"
            groff -man -Tutf8 "$manual" >/dev/null
          done
          test -s "$stage/usr/lib/systemd/user/wiilandd.service"
          test -s "$stage/usr/share/X11/xorg.conf.d/50-xorg-fix-wiiland.conf"
          test -s "$stage/usr/share/icons/hicolor/scalable/apps/io.github.philosophimoonbeam.wiiland.svg"
          "$stage/usr/bin/wiilandd" --no-config --self-test
          "$stage/usr/bin/xwiishow" --help >/dev/null
          WIILANDD="$stage/usr/bin/wiilandd" WIILAND_REPO_DIR="$PWD" \
            "$stage/usr/bin/wiilandd-hardware-report" --help >/dev/null

      - name: Verify ownership-safe uninstall
        run: |
          set -eu
          stage="$RUNNER_TEMP/wiiland-stage"
          keep="$stage/usr/bin/ci-unowned-file"
          changed="$stage/usr/share/man/man7/wiiland.7"
          printf '%s\n' 'not owned by xtask' >"$keep"
          printf '%s\n' '.ci-local-edit' >>"$changed"
          cargo xtask uninstall --destdir "$stage" \
            --prefix /usr --sysconfdir /etc
          test -e "$keep"
          test -e "$changed"
          test ! -e "$stage/usr/bin/wiilandd"
          test ! -e "$stage/usr/bin/wiiland-config"
          test ! -e "$stage/etc/wiiland/.xtask-install"

      - name: Create and verify deterministic source archives
        run: |
          set -eu
          first="$RUNNER_TEMP/wiiland-2-first.tar.xz"
          second="$RUNNER_TEMP/wiiland-2-second.tar.xz"
          cargo xtask dist --output "$first"
          cargo xtask dist --output "$second"
          cmp --silent "$first" "$second"
          cargo xtask verify-dist "$first"
