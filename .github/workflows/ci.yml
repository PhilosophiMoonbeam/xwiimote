name: ci

on:
  push:
  pull_request:

jobs:
  wiilandd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential groff libncurses-dev libtool libudev-dev pkg-config qt6-base-dev
      - name: Run wiilandd smoke script
        run: tests/wiilandd-smoke.sh
      - name: Build and test package
        run: |
          NOCONFIGURE=1 ./autogen.sh
          ./configure --prefix=/usr --enable-qt-ui=yes
          make -j"$(nproc)"
          make check
      - name: Exercise kernel uinput integration
        run: |
          sudo modprobe uinput || test -e /dev/uinput
          sudo ./wiilandd-uinput-test
      - name: Install staged package
        run: |
          make DESTDIR="$PWD/stage" install
          tests/wiilandd-install-smoke.sh "$PWD/stage" /usr yes
